[package]
name = "duplihere"
version = "0.9.3"
authors = ["Tony Asleson <tony.asleson@gmail.com>"]
edition = "2021"
description = "Copy & Paste finder for source files or any structured utf-8 text files"
license = "GPL-3.0-only"
repository = "https://github.com/tasleson/duplihere"
keywords = ["duplicate", "copy-paste", "code-analysis", "text-analysis"]
categories = ["command-line-utilities", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rags-rs = "0.1.4"
glob = "0.3.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0"}
lazy_static = "1.4.0"
rayon = "1.3.0"
dashmap = { version = "5.5.0", features = ["raw-api"] }

[dev-dependencies]
tempfile = "3.0"
